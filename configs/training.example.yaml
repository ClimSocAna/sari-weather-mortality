# Paths under data_config are relative to data_root.
data_config:
  data_root: ../data
  weather:
    tas:
      variable: tas
      path: weather/hostrada_mean_tas_pop_weighted_201101_202512.pt
      start_date: '2011-01-01'
    tdew:
      variable: tdew
      path: weather/hostrada_tdew_pop_weighted_201101_202512.pt
      start_date: '2011-01-01'
    twb:
      variable: twb
      path: weather/hostrada_wet_bulb_pop_weighted_201101_202512.pt
      start_date: '2011-01-01'
    tas_area:
      variable: tas
      path: weather/hostrada_mean_tas_area_mean_201101_202512.pt
      start_date: '2011-01-01'
    tdew_area:
      variable: tdew
      path: weather/hostrada_tdew_area_mean_201101_202512.pt
      start_date: '2011-01-01'
  population_path: population/population_2011-2024.csv
  # Generated by src/sari_t/data/process_deaths.py from the old/new Destatis workbooks.
  mortality_path: death/mortality_20260714.npz
  # Generated by src/sari_t/data/process_sari.py from the original weekly TSV.
  surveillance_path: sari/sari_20260709.npz
  surveillance_start_date: '2014-09-29'
  mortality_first_year: 2000
  population_start_year: 2011
  population_interpolation: true
  population_tail_padding_days: 1000
  mortality_missing_value: -1
  preprocessing_version: stage1-v1
selected_weather: [tas, tdew]
period:
  start_date: '2014-10-13'
  end_date: '2024-12-29'
model_config: {}
predictor_config: {}
training_config: {}
initial_baseline_config:
  method: bottom_10
adaptive_baseline_config:
  method: median_ewma
reference_config:
  temperature_c: 16.0
  relative_humidity_percent: 50.0

# Named policies select the empirical-minimum or fixed-temperature reference.
# These definitions are resolved before saving the experiment's RunConfig.
references:
  min:
    temperature_c: null
  16c:
    temperature_c: 16.0

# Same order as the 12 active commands in each original sweep script.
setups:
  no_mean_alignment:
    training_config:
      align_training_mean: false
  default: {}
  baseline_double_sided:
    adaptive_baseline_config:
      method: median_ewma_d
  baseline_trimmed_mean:
    adaptive_baseline_config:
      method: trimmed_avg
  baseline_static:
    training_config:
      baseline_adaptation: false
  tas_only:
    selected_weather: [tas]
  tas_wet_bulb:
    selected_weather: [tas, twb]
  area_mean:
    selected_weather: [tas_area, tdew_area]
  temperature_only:
    model_config:
      include_sari: false
      include_covid: false
    selected_weather: [tas]
  exclude_temperature:
    training_config:
      exclude_temperature: true
  no_covid:
    model_config:
      include_covid: false
  no_disease:
    model_config:
      include_sari: false
      include_covid: false
